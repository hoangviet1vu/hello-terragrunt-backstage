apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: tenant-provisioning-template
  title: Tenant Provisioning
  description: >-
    Tenant-provisioning template: collects the inputs needed to provision or
    update a tenant's Terragrunt configuration (tenant name, environment, and
    optional components).
spec:
  owner: user:guest
  type: service

  # The input form: collects the values the tenant:provision action maps to the
  # Terragrunt inputs block (tenant_name, environment, and one enable_<component>
  # per selected component).
  parameters:
    - title: Tenant provisioning inputs
      required:
        - tenantName
        - environment
      properties:
        tenantName:
          title: Tenant name
          type: string
          description: >-
            Identifier for the tenant (e.g. sampletenant). Used as the tenant's
            top-level folder name and written to the tenant_name Terragrunt
            input. Must be 1-32 characters of letters, digits, and
            hyphens.
          pattern: '^[A-Za-z0-9-]{1,32}$'
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: >-
            Deployment environment for this tenant configuration. Used as the
            subfolder name and written to the environment Terragrunt input.
            Must be one of dev, test, uat, prod.
          enum:
            - dev
            - test
            - uat
            - prod
          default: dev
        components:
          title: Components
          description: Optional components to enable for this tenant/environment.
          type: array
          items:
            type: string
            enum:
              - dynamodb
              - ecr
          uniqueItems: true
          default: []
          ui:widget: checkboxes

  # Invoke the tenant:provision scaffolder action, which renders/updates the
  # tenant's terragrunt.hcl in the live repo on a new branch and opens a pull
  # request. The workflow ends at the pull request — no terragrunt plan/apply
  # or Terraform/AWS side effects.
  steps:
    - id: provision
      name: Provision tenant Terragrunt config
      action: tenant:provision
      input:
        tenantName: ${{ parameters.tenantName }}
        environment: ${{ parameters.environment }}
        selectedComponents: ${{ parameters.components }}

  # Render the branch name and pull request URL on the results screen.
  output:
    links:
      - title: Open pull request
        url: ${{ steps.provision.output.pullRequestUrl }}
    text:
      - title: Provisioning result
        content: |
          - **Tenant name:** ${{ parameters.tenantName }}
          - **Environment:** ${{ parameters.environment }}
          - **Components:** ${{ parameters.components }}
          - **Branch:** ${{ steps.provision.output.branchName }}
          - **Pull request:** ${{ steps.provision.output.pullRequestUrl }}
