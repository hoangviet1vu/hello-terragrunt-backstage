nodeLinker: node-modules

packageExtensions:
  "@backstage/cli-module-test-jest@*":
    dependencies:
      jest-cli: "^30.0.0"
      jest-environment-node: "^30.0.0"
      jest-runtime: "30.2.0"
  "@backstage/plugin-permission-react@*":
    peerDependencies:
      react-router-dom: "^6.0.0"
  # backend-plugin-api's resolvePackagePath is used by plugins (e.g. the auth
  # backend's AuthDatabase) to locate their own migration files by package
  # name. Under Yarn PnP's strict resolution this requires the target package
  # to be resolvable from backend-plugin-api, which it otherwise is not. Grant
  # it a dependency on the auth backend so `startTestBackend`-based tests that
  # boot the auth plugin can resolve its migrations.
  "@backstage/backend-plugin-api@*":
    dependencies:
      "@backstage/plugin-auth-backend": "^0.30.0"
